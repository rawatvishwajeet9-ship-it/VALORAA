<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account – VALORA Healthcare</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/logo/logo.svg">
  <style>
    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .tab-btn:first-child { border-radius: var(--radius-md) 0 0 var(--radius-md); }
    .tab-btn:last-child { border-radius: 0 var(--radius-md) var(--radius-md) 0; }
    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
  </style>
</head>
<body style="background:#f8fafc;display:flex;flex-direction:column;min-height:100vh;">

  <!-- Public Navbar -->
  <header class="public-navbar">
    <a href="/" class="brand-logo" style="color:var(--text-main);">
      <div class="brand-icon">
        <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 4v16m-8-8h16"/></svg>
      </div>
      <div>VALORA <span style="font-size:0.75rem;font-weight:600;color:var(--primary);text-transform:uppercase;">Health</span></div>
    </a>
    <div style="font-size:0.9rem;">
      Already have an account? <a href="/login.html" style="color:var(--primary);font-weight:600;">Sign In</a>
    </div>
  </header>

  <main style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;">
    <div style="max-width:640px;width:100%;">
      
      <div class="card" style="box-shadow:var(--shadow-lg);padding:36px;border-radius:var(--radius-lg);">
        <div style="text-align:center;margin-bottom:24px;">
          <h2 style="font-size:1.6rem;font-weight:800;color:var(--text-main);margin-bottom:6px;">Create Verified Account</h2>
          <p style="font-size:0.88rem;color:var(--text-muted);">Join the VALORA digital healthcare ecosystem</p>
        </div>

        <!-- Role Tabs with Clean SVG Icons -->
        <div style="display:flex;margin-bottom:24px;">
          <button type="button" class="tab-btn active" id="tab-patient-btn" onclick="switchRole('patient')">
            <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Patient Registration
          </button>
          <button type="button" class="tab-btn" id="tab-doctor-btn" onclick="switchRole('doctor')">
            <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>
            Physician Registration
          </button>
        </div>

        <form id="register-form" autocomplete="off">
          <input type="hidden" id="reg-role" value="patient">

          <!-- Core Account Fields -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="reg-name">Full Legal Name *</label>
              <input type="text" id="reg-name" class="form-control" placeholder="e.g. John Doe" required autocomplete="off">
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-email">Email Address *</label>
              <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required autocomplete="off">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="reg-password">Account Password *</label>
              <div class="password-input-wrapper">
                <input type="password" id="reg-password" class="form-control" placeholder="Min. 6 characters" required minlength="6" autocomplete="new-password">
                <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('reg-password', this)" title="Show or hide password" aria-label="Show password">
                  <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-phone">Phone Number *</label>
              <input type="tel" id="reg-phone" class="form-control" placeholder="10-digit mobile number" required inputmode="numeric" pattern="[0-9]{9,11}" maxlength="11">
              <div class="form-helper">Enter digits only (9 to 11 digits)</div>
            </div>
          </div>

          <!-- Patient Specific Fields -->
          <div id="patient-fields">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="reg-dob">Date of Birth</label>
                <input type="date" id="reg-dob" class="form-control" max="2022-12-31" min="1900-01-01">
                <div class="form-helper">Year must be 2022 or earlier</div>
              </div>
              <div class="form-group">
                <label class="form-label" for="reg-gender">Gender</label>
                <select id="reg-gender" class="form-control">
                  <option value="prefer_not_to_say">Prefer not to say</option>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" for="reg-blood">Blood Group</label>
                <select id="reg-blood" class="form-control">
                  <option value="Unknown">Select Blood Group</option>
                  <option value="A+">A+</option>
                  <option value="A-">A-</option>
                  <option value="B+">B+</option>
                  <option value="B-">B-</option>
                  <option value="AB+">AB+</option>
                  <option value="AB-">AB-</option>
                  <option value="O+">O+</option>
                  <option value="O-">O-</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="reg-emergency-name">Emergency Contact Person</label>
                <input type="text" id="reg-emergency-name" class="form-control" placeholder="Contact Name">
              </div>
              <div class="form-group">
                <label class="form-label" for="reg-emergency-phone">Emergency Phone</label>
                <input type="tel" id="reg-emergency-phone" class="form-control" placeholder="9 to 11 digits" inputmode="numeric" pattern="[0-9]{9,11}" maxlength="11">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="reg-allergies">Known Drug / Food Allergies (comma separated)</label>
              <input type="text" id="reg-allergies" class="form-control" placeholder="e.g. Penicillin, Peanuts, Sulfa">
            </div>
          </div>

          <!-- Doctor Specific Fields -->
          <div id="doctor-fields" style="display:none;">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="reg-license">Medical License Number (MCI/NMC) *</label>
                <input type="text" id="reg-license" class="form-control" placeholder="e.g. MCI-CARD-12345">
              </div>
              <div class="form-group">
                <label class="form-label" for="reg-specialty">Primary Specialty *</label>
                <select id="reg-specialty" class="form-control" onchange="toggleCustomSpecialty(this, 'reg-specialty-custom-group', 'reg-specialty-custom')">
                  <option value="General Medicine">General Medicine / Internal Medicine</option>
                  <option value="Cardiology">Cardiology (Heart Care)</option>
                  <option value="Neurology">Neurology (Brain & Nerves)</option>
                  <option value="Neurosurgery">Neurosurgery</option>
                  <option value="Orthopedics">Orthopedics (Bone & Joint Surgery)</option>
                  <option value="Pediatrics">Pediatrics & Neonatology (Child Health)</option>
                  <option value="Gynecology & Obstetrics">Gynecology & Obstetrics (OB-GYN)</option>
                  <option value="Dermatology">Dermatology & Cosmetology (Skin & Hair)</option>
                  <option value="Oncology">Oncology & Hematology (Cancer Care)</option>
                  <option value="Ophthalmology">Ophthalmology (Eye Specialist & Surgeon)</option>
                  <option value="ENT">ENT / Otolaryngology (Ear, Nose, Throat)</option>
                  <option value="Psychiatry">Psychiatry & Behavioral Health</option>
                  <option value="Gastroenterology">Gastroenterology & Hepatology</option>
                  <option value="Pulmonology">Pulmonology (Respiratory / Chest Medicine)</option>
                  <option value="Nephrology">Nephrology (Kidney Care & Dialysis)</option>
                  <option value="Urology">Urology & Andrology (Urosurgery)</option>
                  <option value="Endocrinology">Endocrinology & Diabetology</option>
                  <option value="Rheumatology">Rheumatology (Autoimmune Diseases)</option>
                  <option value="General Surgery">General & Laparoscopic Surgery</option>
                  <option value="Plastic Surgery">Plastic & Reconstructive Surgery</option>
                  <option value="Radiology">Radiology & Diagnostic Imaging</option>
                  <option value="Anesthesiology">Anesthesiology & Critical Care</option>
                  <option value="Pathology">Pathology & Laboratory Medicine</option>
                  <option value="Emergency Medicine">Emergency & Trauma Care</option>
                  <option value="Dental Surgery">Dental Surgery & Oral Health (Dentist)</option>
                  <option value="Physiotherapy">Physiotherapy & Rehabilitation</option>
                  <option value="Ayurveda / Homeopathy">Ayurveda / Homeopathy / AYUSH Medicine</option>
                  <option value="Clinical Nutrition">Clinical Nutrition & Dietetics</option>
                  <option value="Infectious Diseases">Infectious Diseases Specialist</option>
                  <option value="Geriatric Medicine">Geriatric Medicine (Elderly Care)</option>
                  <option value="Other">Other (Specify Profession / Specialty)</option>
                </select>
                <div id="reg-specialty-custom-group" style="display:none;margin-top:8px;">
                  <label class="form-label" for="reg-specialty-custom" style="font-size:0.75rem;font-weight:700;color:#0d9488;text-transform:uppercase;">Specify Medical Profession / Specialty *</label>
                  <input type="text" id="reg-specialty-custom" class="form-control" placeholder="e.g. Pediatric Neurosurgeon, Ayurvedic Physician, Sports Medicine...">
                </div>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="reg-exp">Clinical Experience (Years)</label>
                <input type="number" id="reg-exp" class="form-control" value="5" min="1" max="60">
              </div>
              <div class="form-group">
                <label class="form-label" for="reg-fee">Consultation Fee (₹)</label>
                <input type="number" id="reg-fee" class="form-control" value="600" min="50" max="100000">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="reg-clinic-name">Clinic / Hospital Affiliation</label>
                <input type="text" id="reg-clinic-name" class="form-control" placeholder="VALORA Care Center">
              </div>
              <div class="form-group">
                <label class="form-label" for="reg-city">Clinic City</label>
                <input type="text" id="reg-city" class="form-control" placeholder="Mumbai, Bangalore, Delhi...">
              </div>
            </div>
          </div>

          <div style="margin-top:24px;">
            <button type="submit" class="btn btn-primary" style="width:100%;padding:11px;font-size:0.95rem;">
              Complete Registration
            </button>
          </div>
        </form>

      </div>

    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script>
    function switchRole(role) {
      document.getElementById('reg-role').value = role;
      if (role === 'patient') {
        document.getElementById('tab-patient-btn').classList.add('active');
        document.getElementById('tab-doctor-btn').classList.remove('active');
        document.getElementById('patient-fields').style.display = 'block';
        document.getElementById('doctor-fields').style.display = 'none';
      } else {
        document.getElementById('tab-doctor-btn').classList.add('active');
        document.getElementById('tab-patient-btn').classList.remove('active');
        document.getElementById('patient-fields').style.display = 'none';
        document.getElementById('doctor-fields').style.display = 'block';
      }
    }

    // Phone validation
    const phoneInput = document.getElementById('reg-phone');
    const emergencyPhone = document.getElementById('reg-emergency-phone');
    bindPhoneInputValidation(phoneInput);
    bindPhoneInputValidation(emergencyPhone);

    // DOB validation
    const dobInput = document.getElementById('reg-dob');
    bindDateOfBirthValidation(dobInput);

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Validate Phone: must be numeric, 9 to 11 digits
      const phoneVal = phoneInput.value.replace(/[^0-9]/g, '');
      if (phoneVal.length < 9 || phoneVal.length > 11) {
        showToast('Phone number must contain between 9 and 11 digits (numbers only).', 'error');
        phoneInput.focus();
        return;
      }

      // Validate Emergency Phone if entered
      if (emergencyPhone.value) {
        const emPhoneVal = emergencyPhone.value.replace(/[^0-9]/g, '');
        if (emPhoneVal.length < 9 || emPhoneVal.length > 11) {
          showToast('Emergency contact phone must contain between 9 and 11 digits.', 'error');
          emergencyPhone.focus();
          return;
        }
      }

      // Validate DOB
      if (dobInput.value) {
        const yr = parseInt(dobInput.value.split('-')[0], 10);
        if (yr > 2022 || yr < 1900) {
          showToast('Invalid Date of Birth. Year cannot be after 2022.', 'error');
          dobInput.focus();
          return;
        }
      }

      const role = document.getElementById('reg-role').value;
      const data = {
        name: document.getElementById('reg-name').value.trim(),
        email: document.getElementById('reg-email').value.trim(),
        password: document.getElementById('reg-password').value,
        phone: phoneVal,
        role: role
      };

      if (role === 'patient') {
        data.date_of_birth = dobInput.value;
        data.gender = document.getElementById('reg-gender').value;
        data.blood_group = document.getElementById('reg-blood').value;
        data.emergency_contact_name = document.getElementById('reg-emergency-name').value.trim();
        data.emergency_contact_phone = emergencyPhone.value.replace(/[^0-9]/g, '');
        const allergies = document.getElementById('reg-allergies').value;
        data.allergies = allergies.split(',').map(s => s.trim()).filter(Boolean);
      } else {
        const license = document.getElementById('reg-license').value.trim();
        if (!license) {
          showToast('Medical license number is mandatory for doctor registration.', 'error');
          return;
        }
        data.license_number = license;
        let specialty = document.getElementById('reg-specialty').value;
        if (specialty === 'Other') {
          const custom = (document.getElementById('reg-specialty-custom')?.value || '').trim();
          if (!custom) {
            showToast('Please enter your specific medical profession / specialty.', 'error');
            document.getElementById('reg-specialty-custom').focus();
            return;
          }
          specialty = custom;
        }
        data.specialty = specialty;
        data.experience_years = parseInt(document.getElementById('reg-exp').value) || 1;
        data.consultation_fee = parseFloat(document.getElementById('reg-fee').value) || 500;
        data.clinic_name = document.getElementById('reg-clinic-name').value.trim();
        data.city = document.getElementById('reg-city').value.trim();
      }

      await handleRegister(data);
    });
  </script>
</body>
</html>
